name: Deploy to GitHub Pages

on:
  push:
    branches:
      - UI-and-retry-rate

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build site
        run: |
          mkdir -p _site
          # Copy root index.html
          cp index.html _site/
          # Copy web assets
          cp -r web/static _site/ || true
          mkdir -p _site/ui
          cp -r web/ui/* _site/ui/ || true
          
          # List what we built
          echo "Built site contents:"
          find _site -type f | head -20

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: '_site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v2